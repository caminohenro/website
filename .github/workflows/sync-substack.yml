name: Sync Substack Essays

on:
  schedule:
    # Checks Substack every day at 2am
    - cron: '0 2 * * *'
  workflow_dispatch: # Adds a manual "Run workflow" button in GitHub Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: substack-sync # Change to 'main' when ready for production

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Substack Newsletter Log metadata
        run: node scripts/sync-substack-newsletters.mjs
        continue-on-error: true

      - name: Commit and push new essays & newsletter log
        run: |
          git config user.name "Camino Henro Bot"
          git config user.email "actions@github.com"
          git add src/content/essays src/data/substack-synced.json src/data/newsletter-log.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(substack): sync essays and monthly newsletter log"
            git push
          else
            echo "No new Substack updates to commit."
          fi