# Preserve settings not represented in a CMS form when saving.
settings:
  content:
    merge: true

media:
  name: assets
  label: Site & Essay Media
  input: public/assets
  output: /assets

content:
  - name: essays
    label: Essays & Dispatches
    type: collection
    path: src/content/essays
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      fields: [title, location, date, draft]
      sort: [date]
      order: desc
    fields:
      - name: title
        label: Essay Title
        type: string
        required: true
      - name: subtitle
        label: Subtitle
        type: string
      - name: date
        label: Date
        type: date
        required: true
      - name: location
        label: Current Trail Location
        type: string
        required: true
      - name: kilometersWalked
        label: Total Kilometers Walked
        type: number
      - name: excerpt
        label: Short Summary / Excerpt
        type: text
        required: true
      - name: draft
        label: Draft (Hide from live site)
        type: boolean
        default: false
      - name: body
        label: Essay Text (Markdown)
        type: rich-text

  - name: finances
    label: Finances Ledger
    type: file
    path: src/data/finances.json
    format: json
    fields:
      - name: currencySymbol
        label: Currency Symbol
        type: string
        default: "€"
      - name: startingReserve
        label: Starting Reserve Amount
        type: number
      - name: lastUpdated
        label: Last Updated Date
        type: string
      - name: note
        label: Ledger Header Note
        type: text
      - name: entries
        label: Ledger Entries (Osettai & Expenses)
        type: object
        list: true
        fields:
          - name: id
            label: Entry ID
            type: string
          - name: date
            label: Date (YYYY-MM-DD)
            type: string
          - name: type
            label: Entry Type
            type: select
            options:
              values:
                - { label: "Osettai (Contribution)", value: "osettai" }
                - { label: "Expense", value: "expense" }
          - name: category
            label: Category
            type: string
          - name: description
            label: Description
            type: string
          - name: location
            label: Location
            type: string
          - name: amount
            label: Amount
            type: number

  - name: inventory
    label: RPG Gear Inventory (Edition 2)
    type: file
    path: src/data/inventory.json
    format: json
    fields:
      - name: items
        label: Gear Items
        type: object
        list: true
        fields:
          - name: id
            label: Item ID
            type: string
          - name: name
            label: Item Name
            type: string
          - name: japaneseName
            label: Japanese Name / Subtitle
            type: string
          - name: slot
            label: Equipment Slot
            type: select
            options:
              values: ["Equipped", "Main Pack", "Shelter & Sleep", "Electronics & Writing", "Consumables"]
          - name: weightGrams
            label: Weight (Grams)
            type: number
          - name: condition
            label: Condition
            type: select
            options:
              values: ["Pristine", "Seasoned", "Worn", "Need Replacement"]
          - name: shortSummary
            label: Short Summary
            type: string
          - name: lore
            label: Philosophical / Field Lore
            type: text

  - name: route
    label: Trail Map Checkpoints (Edition 2)
    type: file
    path: src/data/route.json
    format: json
    fields:
      - name: stats
        label: Overall Trail Statistics
        type: object
        fields:
          - name: totalPlannedKm
            label: Total Planned Kilometers
            type: number
          - name: completedKm
            label: Completed Kilometers
            type: number
          - name: daysOnTrail
            label: Days on Trail
            type: number
          - name: countriesCrossed
            label: Countries Crossed
            type: number
      - name: checkpoints
        label: Walked Checkpoints
        type: object
        list: true
        fields:
          - name: id
            label: Checkpoint ID
            type: string
          - name: title
            label: Town / Stage Name
            type: string
          - name: date
            label: Date Reached
            type: string
          - name: lat
            label: Latitude
            type: number
          - name: lng
            label: Longitude
            type: number
          - name: kmMarker
            label: Kilometer Marker
            type: number
          - name: summary
            label: Stage Note
            type: text
          - name: essaySlug
            label: Linked Essay Slug (Optional)
            type: string

  - name: faq
    label: FAQ Items
    type: file
    path: src/data/faq.json
    format: json
    fields:
      - name: categories
        label: FAQ Categories
        type: object
        list: true
        fields:
          - name: categoryName
            label: Category Name
            type: string
          - name: items
            label: Questions & Answers
            type: object
            list: true
            fields:
              - name: question
                label: Question
                type: string
              - name: answer
                label: Answer
                type: text

  - name: credits
    label: Credits & Gratitude
    type: file
    path: src/data/credits.json
    format: json
    fields:
      - name: sections
        label: Gratitude Sections
        type: object
        list: true
        fields:
          - name: title
            label: Section Title
            type: string
          - name: entries
            label: Supporters / Hosts
            type: object
            list: true
            fields:
              - name: name
                label: Name or Alias
                type: string
              - name: locationOrRole
                label: Location or Role
                type: string
              - name: note
                label: Gratitude Note
                type: string

  - name: siteConfig
    label: Site Settings & Edition 2 Toggles
    type: file
    path: src/data/siteConfig.json
    format: json
    fields:
      - name: siteTitleJp
        label: Website Title (Japanese)
        type: string
      - name: siteTitleEn
        label: Website Title (English)
        type: string
      - name: tagline
        label: Website Tagline
        type: text
      - name: crestImage
        label: Crest Image
        type: image
      - name: routeSummary
        label: Route Summary
        type: string
      - name: supabase
        label: Forum Supabase Settings
        type: object
        fields:
          - name: url
            label: Supabase Project URL
            type: string
          - name: anonKey
            label: Supabase Public Anonymous Key
            description: Use only the public anon key, never a service role or secret key.
            type: string
      - name: currentLocation
        label: Current Trail Location Banner
        type: string
      - name: stripeDonationUrl
        label: Stripe Osettai Payment Link
        type: string
      - name: features
        label: Edition 2 Module Toggles
        type: object
        fields:
          - name: enableInventory
            label: Show Inventory Page
            type: boolean
          - name: enableMap
            label: Show Map Page
            type: boolean
          - name: enableForum
            label: Show Forum Page
            type: boolean
          - name: enableGallery
            label: Show Gallery Page
            type: boolean

  - name: translationInbox
    label: "Translations Staging Inbox"
    type: file
    path: src/data/translation-inbox.json
    format: json
    fields:
      - name: notice
        label: How This Inbox Works
        type: text
      - name: items
        label: Updated Pages & Essays Awaiting Decision
        type: object
        list: true
        fields:
          - name: id
            label: Item ID
            type: string
          - name: title
            label: Page or Essay Name
            type: string
          - name: itemType
            label: Content Type
            type: select
            options:
              values:
                - { label: "Essay", value: "essay" }
                - { label: "Website Page", value: "page" }
          - name: sourcePath
            label: Source File Path
            type: string
          - name: lastModified
            label: Change Detected On
            type: string
          - name: action
            label: Translation Decision
            type: select
            options:
              values:
                - { label: "Pending (Keep in Inbox)", value: "pending" }
                - { label: "Translate Now (PT-PT, ES, FR, JA)", value: "translate" }
                - { label: "Ignore Change (Dismiss from Inbox)", value: "ignore" }

  - name: pageHome
    label: "Page Text: Home Page"
    type: file
    path: src/data/pages/home.json
    format: json
    fields:
      - name: eyebrow
        label: Top Route Eyebrow
        type: string
      - name: heading
        label: Main Heading
        type: string
      - name: subtitle
        label: Tagline Subtitle
        type: string
      - name: manifestoDivider
        label: Manifesto Divider Title
        type: string
      - name: manifestoQuoteLine1
        label: Manifesto Quote (Line 1)
        type: text
      - name: manifestoQuoteLine2
        label: Manifesto Quote (Line 2)
        type: text
      - name: manifestoQuoteLine3
        label: Manifesto Quote (Line 3)
        type: string
      - name: manifestoQuoteLine4
        label: Manifesto Quote (Line 4)
        type: string
      - name: manifestoBodyHtml
        label: Manifesto Body Paragraph (HTML allowed)
        type: text
      - name: essaysDivider
        label: Latest Essays Divider Title
        type: string
      - name: essayNumberPrefix
        label: Essay Number Prefix
        type: string
      - name: unrollEssayLink
        label: Unroll Essay Link Text
        type: string
      - name: viewArchiveBtn
        label: View Archive Button Text
        type: string
      - name: courtyardDivider
        label: Forum Spotlight Divider Title
        type: string
      - name: spotlightLabel
        label: Spotlight Header Label
        type: string
      - name: mostPopularTab
        label: Most Popular Button Label
        type: string
      - name: latestInquiryTab
        label: Latest Inquiry Button Label
        type: string
      - name: enterCourtyardLink
        label: Enter Courtyard Link Text
        type: string

  - name: pageDonate
    label: "Page Text: Donate (Osettai)"
    type: file
    path: src/data/pages/donate.json
    format: json
    fields:
      - name: metaTitle
        label: Browser Tab Title
        type: string
      - name: metaDescription
        label: Meta Description
        type: text
      - name: eyebrow
        label: Top Eyebrow
        type: string
      - name: heading
        label: Page Heading
        type: string
      - name: subtitle
        label: Page Subtitle
        type: string
      - name: introBody
        label: Philosophical Explanation Paragraph
        type: text
      - name: tiersHeading
        label: Tiers Section Heading
        type: string
      - name: selectOfferingCta
        label: Tier Card Link Text
        type: string
      - name: primaryStripeCta
        label: Main Stripe Button Text
        type: string
      - name: ledgerLinkText
        label: Financial Ledger Link Text
        type: string
      - name: tiers
        label: Contribution Tiers
        type: object
        list: true
        fields:
          - name: title
            label: Tier Title
            type: string
          - name: amount
            label: Amount Badge
            type: string
          - name: jp
            label: Japanese Subtitle
            type: string
          - name: description
            label: Tier Description
            type: text

  - name: pageCreditsUi
    label: "Page Text: Credits Page Headers"
    type: file
    path: src/data/pages/credits-ui.json
    format: json
    fields:
      - name: eyebrow
        label: Top Eyebrow
        type: string
      - name: heading
        label: Page Heading
        type: string
      - name: subtitle
        label: Page Subtitle
        type: string
      - name: emptySectionText
        label: Empty Section Fallback Text
        type: string
      - name: calloutHeading
        label: Bottom Callout Heading
        type: string
      - name: calloutBody
        label: Bottom Callout Body
        type: text
      - name: offerOsettaiBtn
        label: Offer Osettai Button Label
        type: string
      - name: viewLedgerBtn
        label: View Ledger Button Label
        type: string

  - name: pageFaqUi
    label: "Page Text: FAQ Page Headers"
    type: file
    path: src/data/pages/faq-ui.json
    format: json
    fields:
      - name: eyebrow
        label: Top Eyebrow
        type: string
      - name: heading
        label: Page Heading
        type: string
      - name: subtitle
        label: Page Subtitle
        type: string
      - name: bottomHeading
        label: Bottom Callout Heading
        type: string
      - name: bottomBody
        label: Bottom Callout Body
        type: text
      - name: bottomBtn
        label: Bottom Callout Button Label
        type: string

  - name: pageEssaysUi
    label: "Page Text: Essays Archive & Reader UI"
    type: file
    path: src/data/pages/essays-ui.json
    format: json
    fields:
      - name: eyebrow
        label: Archive Top Eyebrow
        type: string
      - name: heading
        label: Archive Heading
        type: string
      - name: subtitle
        label: Archive Subtitle
        type: string
      - name: readFullDispatchBtn
        label: Read Full Dispatch Link
        type: string
      - name: backToDispatches
        label: Back to All Dispatches Link
        type: string
      - name: shareEyebrow
        label: Share Box Eyebrow
        type: string
      - name: shareHeading
        label: Share Box Heading
        type: string
      - name: osettaiPrompt
        label: Essay Footer Osettai Prompt
        type: text
      - name: offerOsettaiBtn
        label: Essay Footer Osettai Button
        type: string

  - name: pageComingSoon
    label: "Page Text: Coming Soon Pages"
    type: file
    path: src/data/pages/coming-soon.json
    format: json
    fields:
      - name: sharedHeading
        label: Main Cursive Heading
        type: string
      - name: sharedMessageHtml
        label: Shared Patience Message (HTML allowed)
        type: text
      - name: sneakPreviewBeforeLink
        label: Sneak Preview Text (Before Link)
        type: string
      - name: sneakPreviewLinkText
        label: Sneak Preview Link Text
        type: string
      - name: sneakPreviewAfterLink
        label: Sneak Preview Text (After Link)
        type: string

  - name: pageGlobalUi
    label: "Page Text: Header, Footer & Newsletter"
    type: file
    path: src/data/pages/global-ui.json
    format: json
    fields:
      - name: header
        label: Header Navigation Labels
        type: object
        fields:
          - name: home
            label: Home
            type: string
          - name: blog
            label: Blog
            type: string
          - name: faq
            label: FAQ
            type: string
          - name: credits
            label: Credits
            type: string
          - name: comingSoon
            label: Coming Soon Dropdown
            type: string
          - name: donateBtn
            label: Donate Button
            type: string
      - name: footer
        label: Scroll Footer Hint
        type: object
        fields:
          - name: scrollFootHint
            label: Bottom Roller Hint Text
            type: string
      - name: newsletter
        label: Global Newsletter Footer Box
        type: object
        fields:
          - name: eyebrow
            label: Newsletter Eyebrow
            type: string
          - name: heading
            label: Newsletter Heading
            type: string
          - name: copy
            label: Newsletter Description
            type: text
          - name: placeholder
            label: Email Input Placeholder
            type: string
          - name: submitBtn
            label: Subscribe Button Text
            type: string
