    <path d="M 120 182 L 74 134 C 68 106 94 94 120 94 C 146 94 172 106 166 134 Z" fill="#E6DFCF" stroke="#6E2B25" stroke-width="4.5" />
    <!-- Scallop Shell Ribs -->
